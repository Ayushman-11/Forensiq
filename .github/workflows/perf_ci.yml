name: Scale & Performance CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  performance-budgets:
    name: Enforce Performance Budgets & 100x Scale
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install mongomock_motor pytest pytest-asyncio respx locust httpx

      - name: Test Multi-Tenant Investigation Fairness & Autoscaling
        run: |
          pytest backend/tests/test_investigation_fairness.py -v

      - name: Benchmark 100x Ingestion Scale & SPL Pushdown
        run: |
          python backend/scripts/benchmark_ingestion_100x.py
          pytest backend/tests/test_ingestion_scale.py -v

      - name: Enforce CI Endpoint Latency Budgets
        run: |
          pytest backend/tests/test_performance_budgets.py -s -v

  locust-load-test:
    name: Run Headless 50-Analyst Load Test
    runs-on: ubuntu-latest
    needs: performance-budgets

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install locust uvicorn httpx

      - name: Seed 10,000 CI Load Test Records
        env:
          FORENSIQ_MONGO_URI: mongodb://localhost:27017
          FORENSIQ_MONGO_DB_NAME: forensiq_load_test
        run: |
          python backend/scripts/seed_load_test_data.py 10000

      - name: Start Forensiq Backend Server
        env:
          FORENSIQ_MONGO_URI: mongodb://localhost:27017
          FORENSIQ_MONGO_DB_NAME: forensiq_load_test
        run: |
          cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Execute Locust Load Test (50 Analysts, 30s)
        run: |
          locust -f backend/tests/load/locustfile.py \
            --headless \
            -u 50 \
            -r 10 \
            --run-time 30s \
            --host http://localhost:8000 \
            --stop-timeout 5 \
            --html load-report.html

      - name: Upload Load Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-load-report
          path: load-report.html
