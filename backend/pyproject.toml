[project]
name = "forensiq-backend"
version = "0.1.0"
description = "Forensiq Security Operations & AI Investigation Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0",
    "sqlalchemy>=2.0.35",
    "motor>=3.6.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "httpx>=0.27.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0",
    "langgraph>=0.2.14",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "reportlab>=4.0.0",
    "pyyaml>=6.0",
    "tldextract>=5.1",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "mongomock-motor>=0.0.34"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "BLE",  # blind-except (BLE001)
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",   # assert statements are fine in tests
    "S603",   # subprocess — reviewed individually
    "S607",   # partial path to executable — reviewed individually
    "B008",   # function calls in default args — FastAPI Depends() pattern
    "RUF012", # mutable class variables — Pydantic uses them
    "E501",   # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S105", "BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
follow_imports = "silent"
warn_unused_ignores = false
# Exclude generated / third-party directories
exclude = ["__pycache__", ".venv", "build"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

