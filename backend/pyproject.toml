[project]
name = "forensiq-backend"
version = "0.1.0"
description = "Forensiq Security Operations & AI Investigation Platform Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "motor>=3.6.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "httpx>=0.27.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0",
    "langgraph>=0.2.14",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "mongomock-motor>=0.0.34"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.hatch.build.targets.wheel]
packages = ["app"]
