version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: forensiq-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.runCommand({ ping: 1 }).ok\" localhost:27017/forensiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forensiq-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: forensiq-backend
    restart: always
    environment:
      - FORENSIQ_ENV=development
      - FORENSIQ_MONGO_URI=mongodb://mongo:27017
      - FORENSIQ_MONGO_DB_NAME=forensiq
      - FORENSIQ_REDIS_URL=redis://redis:6379/0
      - FORENSIQ_SPLUNK_URL=https://host.docker.internal:8089
    ports:
      - "8001:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongo_data:
