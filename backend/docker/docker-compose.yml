version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forensiq-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forensiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forensiq-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: forensiq-backend
    restart: always
    environment:
      - FORENSIQ_ENV=development
      - FORENSIQ_POSTGRES_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/forensiq
      - FORENSIQ_REDIS_URL=redis://redis:6379/0
      - FORENSIQ_SPLUNK_URL=https://host.docker.internal:8089
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
